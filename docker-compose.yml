services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-2567}
      NODE_ENV: production
    ports:
      - "${BACKEND_HOST_PORT:-2567}:2567"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_PHASER_API: ${VITE_PHASER_API:-}
        VITE_COLYSEUS_URL: ${VITE_COLYSEUS_URL:-}
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
