version: "3.8"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_COLYSEUS_URL=ws://localhost:3000
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
